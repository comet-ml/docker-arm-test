name: Split Runners Multi-arch (split-runners)
run-name: Split Runners Multi-arch (split-runners)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            platform_key: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform_key: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest_amd64: ${{ steps.set-outputs.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.set-outputs.outputs.digest_arm64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=split-runners

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Set job outputs
        id: set-outputs
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ "${{ matrix.platform_key }}" = "amd64" ]; then
            echo "digest_amd64=${DIGEST}" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.platform_key }}" = "arm64" ]; then
            echo "digest_arm64=${DIGEST}" >> $GITHUB_OUTPUT
          fi
          echo "Digest for ${{ matrix.platform }}: ${DIGEST}"

      - name: Create build summary
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          
          echo "## 🏗️ Build Summary - ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** \`${{ matrix.platform }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Runner:** \`${{ matrix.runner }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${IMAGE_NAME}@${DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Provenance:** Enabled (mode=max)" >> $GITHUB_STEP_SUMMARY
          echo "**SBOM:** Enabled" >> $GITHUB_STEP_SUMMARY

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=split-runners

      - name: Get digests from build jobs
        id: get-digests
        run: |
          # Get digests from build job outputs using GitHub API
          echo "Fetching digests from build jobs..."
          
          # Query the workflow run to get job outputs
          # Each matrix job sets digest_amd64 or digest_arm64 outputs
          # Find the job that has digest_amd64 output (amd64 build)
          AMD64_DIGEST=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs --jq '[.jobs[] | select(.name == "build") | select(.conclusion == "success") | select(.outputs.digest_amd64 != null) | .outputs.digest_amd64][0]' | tr -d '"')
          
          # Find the job that has digest_arm64 output (arm64 build)
          ARM64_DIGEST=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs --jq '[.jobs[] | select(.name == "build") | select(.conclusion == "success") | select(.outputs.digest_arm64 != null) | .outputs.digest_arm64][0]' | tr -d '"')
          
          if [ -z "$AMD64_DIGEST" ] || [ -z "$ARM64_DIGEST" ]; then
            echo "Error: Could not retrieve digests from build jobs"
            echo "AMD64_DIGEST: ${AMD64_DIGEST}"
            echo "ARM64_DIGEST: ${ARM64_DIGEST}"
            echo "Debug: Listing all build job outputs..."
            gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs --jq '.jobs[] | select(.name == "build") | {name: .name, conclusion: .conclusion, outputs: .outputs}'
            exit 1
          fi
          
          echo "AMD64_DIGEST=${AMD64_DIGEST}" >> $GITHUB_OUTPUT
          echo "ARM64_DIGEST=${ARM64_DIGEST}" >> $GITHUB_OUTPUT
          echo "Found digests:"
          echo "  AMD64: ${AMD64_DIGEST}"
          echo "  ARM64: ${ARM64_DIGEST}"
          
      - name: Create manifest list and push
        run: |
          AMD64_DIGEST="${{ steps.get-digests.outputs.AMD64_DIGEST }}"
          ARM64_DIGEST="${{ steps.get-digests.outputs.ARM64_DIGEST }}"
          
          # Create manifest list
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${AMD64_DIGEST} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${ARM64_DIGEST}

      - name: Inspect image
        id: inspect
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Create summary
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          
          echo "## 🐳 Docker Images Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Multi-arch Image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get platform information
          PLATFORMS=$(docker buildx imagetools inspect ${IMAGE_TAG} --format '{{json .}}' | jq -r '.manifests[]?.platform | "\(.os)/\(.architecture)"' | sort -u | tr '\n' ', ' | sed 's/,$//')
          echo "**Platforms:** ${PLATFORMS}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get digests
          echo "### Digests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect ${IMAGE_TAG} --format '{{json .}}' | jq -r '.manifests[]? | "**\(.platform.os)/\(.platform.architecture):** " + "`" + .digest + "`"' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "**Provenance:** Enabled (mode=max)" >> $GITHUB_STEP_SUMMARY
          echo "**SBOM:** Enabled" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Add links
          echo "### Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          REPO_OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo "- [View on GitHub Container Registry](https://github.com/${{ github.repository }}/pkgs/container/${REPO_NAME})" >> $GITHUB_STEP_SUMMARY
          echo "- Pull command: \`docker pull ${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
